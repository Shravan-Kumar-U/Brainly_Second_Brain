<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Brainly" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="description" content="Brainly: your second brain. Save now, remember later." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Brainly" />
    <meta property="og:description" content="Your second brain. Save now, remember later." />
    <title>Brainly</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('brainly.theme') || 'system';
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
